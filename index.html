<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Impact of Climate Events on World Economics</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.js"></script>
</head>

<body>
<div id="main-grid-container">

    <div id="global-settings-area">
        <h2 class="section-title">Impact of Climate Events on World Economics</h2>

        <div class="controls">

            <div id="event-panel">
                <div id="event-header">Filter by Event Categories</div>

                <div id="event-buttons-row">
                    <div class="settings-info-inline">
                        These global settings control how all charts are filtered.
                    </div>

                    <div id="event-buttons">
                        <button id="event-select-all">Select All</button>
                        <button id="event-deselect-all">Deselect All</button>
                    </div>
                </div>

                <div id="event-checkbox-container"></div>
            </div>

            <div id="range-wrapper">

                <div class="range-box">
                    <label>Year Range</label>
                    <div id="yearRange"></div>
                    <span id="year-label">2020 – 2025</span>
                </div>

                <div class="range-box">
                    <label>Severity</label>
                    <input type="range" id="severity-slider" min="0" max="9" value="0">
                    <div id="severity-label">0+</div>
                </div>

            </div>


        </div>
    </div>

    <div id="map-area-container">
        <div id="map"></div>
    </div>

    <div id="bar-switch-area">
        <div class="switch-container" id="bar-sort-switch">
            <div class="switch-option active" data-sort="damage">Economic Damage</div>
            <div class="switch-option" data-sort="aid">International Aid</div>
        </div>
    </div>

    <div id="buttons-container" class="tabs">
        <button data-tab="incidents" class="active">Number of Incidents</button>
        <button data-tab="damage">Economic Damage</button>
        <button data-tab="aid">International Aid</button>
        <button data-tab="casualties">Casualties</button>
    </div>

    <div id="bar"></div>

    <div id="linechart-container">
        <div id="empty-space"></div>
        <div class="line-reset-wrapper">
            <button id="reset-line" class="reset-button">Reset Line Chart</button>
        </div>
    </div>

</div>

<div id="tooltip" class="tooltip"></div>
<div id="line-tooltip" class="tooltip"></div>

<script type="module" src="js/mapChart.js"></script>
<script type="module" src="js/barChart.js"></script>
<script type="module" src="js/lineChart.js"></script>
<script type="module" src="js/main.js"></script>

</body>
</html>
